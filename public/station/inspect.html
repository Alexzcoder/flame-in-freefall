<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspect &amp; ignite · Flame in Freefall</title>
<link rel="icon" href="../img/ember-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
:root{--bg:#07090e;--panel:#12151ef0;--line:#2a303c;--fg:#e4e7ee;--mute:#8a93a6;--acc:#ff7a2f;--red:#ff5c6a;--amber:#f6c945;--grey:#9aa3b5;--green:#3ecf8e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#1b2233 0%,#0b0e16 55%,#05060a 100%)}
.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px}
.bar a{color:var(--fg);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:8px}
.bar h1{font-size:15px;margin:0 0 0 6px;color:var(--mute);font-weight:600}
.seg{display:flex;background:#12151e;border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{font:inherit;color:var(--mute);background:none;border:0;border-radius:7px;padding:6px 12px;cursor:pointer}.seg button.on{background:var(--acc);color:#1a0d05;font-weight:700}
.title{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:4;text-align:center;pointer-events:none}
.title .name{font-size:30px;font-weight:800;letter-spacing:.01em}
.title .band{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:20px}
.title .line{height:3px;width:min(520px,70vw);margin:10px auto 0;border-radius:3px}
.card{position:fixed;left:16px;top:150px;z-index:5;width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px}
.card .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #222836}.card .row:last-of-type{border:0}
.card .k{color:var(--mute)}.card .v{text-align:right;font-weight:600}
.card .note{color:#c9cdd6;margin:8px 0 0;font-size:12.5px}.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:4px;background:#f6c94522;color:#f6dc8a}
.ctl{position:fixed;right:16px;bottom:118px;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.ctl button{font:inherit;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:#12151e;color:var(--fg)}
.ctl button.fire{background:var(--acc);color:#1a0d05;border-color:var(--acc)}
.ctl .clock{background:#12151ecc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:#c9cdd6;text-align:right;min-width:220px}
.ctl .clock b{color:var(--fg);font-size:18px}
.msg{position:fixed;left:50%;bottom:122px;transform:translateX(-50%);z-index:5;background:#12151ef0;border:1px solid var(--line);border-radius:12px;padding:9px 16px;max-width:min(560px,90vw);text-align:center;display:none}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px;background:linear-gradient(#07090e00,#07090eee 40%)}
.strip .it{cursor:pointer;background:#12151e;border:1px solid var(--line);border-radius:10px;padding:8px 14px 10px;min-width:120px;text-align:center;font-weight:600;font-size:13px;position:relative;overflow:hidden}
.strip .it::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.strip .it.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 8px 24px #0008;transform:translateY(-3px)}
.strip .arrow{font:inherit;font-size:20px;background:none;border:0;color:var(--fg);cursor:pointer;padding:6px 10px}
.hint{position:fixed;right:16px;top:60px;z-index:4;color:var(--mute);font-size:12px;text-align:right}
@media(max-width:760px){.card{top:auto;bottom:178px;max-height:34vh;overflow:auto}.ctl{bottom:auto;top:110px}.strip{overflow-x:auto;justify-content:flex-start}.title .name{font-size:22px}.hint{display:none}}
</style>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <a href="/station/"><img src="../img/ember-logo.gif" width="34" height="34" alt="Flame in Freefall"> ← Station</a>
  <h1>Inspect &amp; ignite</h1>
  <div class="seg" id="hab"><button data-h="iss">ISS module</button><button data-h="moon">Moon base</button></div>
</div>
<div class="title"><div class="name" id="name"></div><div class="band" id="band"></div><div class="line" id="line"></div></div>
<div class="hint">Drag to inspect · click the object to light it there<br>← → to switch objects</div>
<aside class="card" id="card"></aside>
<div class="ctl">
  <div class="clock" id="clock">Ready</div>
  <button class="fire" id="ignite">🔥 Ignite</button>
  <button id="fans">Fans: on</button>
  <button id="reset">↺ Reset</button>
</div>
<div class="msg" id="msg"></div>
<nav class="strip" id="strip"></nav>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { ITEMS } from "./habitat3d.js";
import { materialVerdict, MATERIALS } from "./firemodel.js";

const $ = id => document.getElementById(id);
// same habitat air as station/inside.html and flame/insights.py
const COND = { iss: { o2: 0.21, pressure_kpa: 101.325, gravity_g: 0, vent_cm_s: 10 }, moon: { o2: 0.30, pressure_kpa: 70.3, gravity_g: 0.166, vent_cm_s: 5 } };
const SIMFUEL = { fabric: "fabric", pmma_thin: "fabric", pmma_thick: "pmma", nomex: "fabric", silicone: "pmma" };
const LIST = Object.keys(ITEMS).filter(k => ITEMS[k].cat === "burn");
const q = new URLSearchParams(location.search);
let hab = q.get("hab") === "moon" ? "moon" : "iss", idx = Math.max(0, LIST.indexOf(q.get("item")));
const [insights, risk] = await Promise.all(["insights.json", "risk.json"].map(f => fetch(f).then(r => r.ok ? r.json() : null).catch(() => null)));

// ---------- what the models say about this object here ----------
function facts(id) {
  const it = ITEMS[id], c = COND[hab], v = materialVerdict(it.mat, c);
  const ins = insights?.habitats?.[hab]?.items?.[id], rk = risk?.habitats?.[hab];
  const sf = SIMFUEL[it.mat];
  const speed = fans => rk?.spread?.[`${sf}_${fans}`]?.mm_s ?? null;
  const noIgnite = v.state === "no_spread";
  const band = noIgnite ? ["Didn't ignite in NASA tests here", "var(--grey)"]
    : ins?.fans_off?.burns ? ["Keeps burning even with the fans off", "var(--red)"]
    : ins?.fans_on?.burns ? ["Goes out when the fans stop", "var(--amber)"]
    : ["A small flame dies out here", "var(--green)"];
  return { it, c, v, ins, noIgnite, band, speedOn: speed("on"), speedOff: speed("off"),
           safe: rk?.fans?.on?.objects?.[id]?.safe_distance_m, minO2: ins?.min_o2_burning_fans_on };
}

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
$("view").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 100);
camera.position.set(2.6, 1.5, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.8; controls.minDistance = 1.2; controls.maxDistance = 7;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); key.castShadow = true; scene.add(key);
scene.add(new THREE.HemisphereLight(0xbfd3ff, 0x1a1208, 0.6));
const stand = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.35, 0.06, 64), new THREE.MeshStandardMaterial({ color: 0x1c212d, metalness: 0.6, roughness: 0.4 }));
stand.position.y = -0.03; stand.receiveShadow = true; scene.add(stand);
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.012, 8, 96), new THREE.MeshBasicMaterial({ color: 0xff7a2f }));
ring.rotation.x = Math.PI / 2; scene.add(ring);
// airflow arrow on the stand (the vent blows along +x)
const arrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1.1, 0.02, 1.05), 0.6, 0x5aa9ff, 0.14, 0.09); scene.add(arrow);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------- burn shader: char inside the front, glow at the front ----------
const U = { uIgn: { value: new THREE.Vector3(0, -99, 0) }, uR: { value: 0 }, uVent: { value: new THREE.Vector3(1, 0, 0) },
            uStretch: { value: 0.5 }, uLive: { value: 0 } };
function burnable(mat) {
  const m = mat.clone();
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vW;")
      .replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvW = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>
      varying vec3 vW; uniform vec3 uIgn, uVent; uniform float uR, uStretch, uLive;
      float burnDist(){ vec3 d = vW - uIgn; return length(d) - uStretch * dot(d, uVent); }  // downwind reads closer: spreads faster`)
      .replace("#include <color_fragment>", `#include <color_fragment>
      float bd = burnDist();
      float charred = 1.0 - smoothstep(uR - 0.05, uR, bd);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.07, 0.055, 0.045), charred * 0.94);`)
      .replace("#include <aomap_fragment>", `#include <aomap_fragment>
      reflectedLight.indirectDiffuse *= 1.0 - charred * 0.85; reflectedLight.indirectSpecular *= 1.0 - charred * 0.95;
      reflectedLight.directSpecular *= 1.0 - charred * 0.95;`)
      .replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>
      float band = exp(-pow((bd - uR) / 0.035, 2.0)) * uLive;
      // embers: patchy glow only just behind the front (the material that is still burning), fading into char
      float mott = 0.5 + 0.5 * sin(vW.x * 23.0) * sin(vW.y * 29.0 + 1.3) * sin(vW.z * 19.0 + 2.1);
      float ember = charred * exp(-max(uR - bd, 0.0) / 0.08) * mott * uLive;
      totalEmissiveRadiance += vec3(1.0, 0.38, 0.06) * (band * 4.0 + ember * 1.6) + vec3(0.25, 0.4, 1.0) * band * 0.6;`);
  };
  return m;
}

// ---------- flame sprites along the front ----------
const flameTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,240,200,1)"); gr.addColorStop(0.3, "rgba(255,150,40,.8)");
  gr.addColorStop(0.7, "rgba(255,70,10,.25)"); gr.addColorStop(1, "rgba(255,40,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const sprites = [];
for (let i = 0; i < 400; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 }));
  s.userData = { life: 0 }; scene.add(s); sprites.push(s);
}
let points = [];  // surface samples (world space) of the current object
const dist = p => { const d = p.clone().sub(U.uIgn.value); return d.length() - U.uStretch.value * d.dot(U.uVent.value); };

// ---------- loading objects ----------
const loader = new GLTFLoader(), cache = {};
let current = null, size = 1;
function cablesModel() {  // no generated model: a bundle of jacketed cables in a tray
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: 0xdedede, roughness: 0.55 });
  [[0, 0], [0.05, 0.02], [-0.05, 0.02], [0.025, 0.06], [-0.025, 0.06]].forEach(([x, y], i) => {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.6, 16), i % 2 ? mat : new THREE.MeshStandardMaterial({ color: 0x9aa3b5, roughness: 0.6 }));
    c.rotation.z = Math.PI / 2; c.position.set(0, 0.04 + y, x); g.add(c); });
  const tray = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.02, 0.2), new THREE.MeshStandardMaterial({ color: 0x555b66, metalness: 0.7, roughness: 0.4 }));
  g.add(tray); return g;
}
async function load(id) {
  const it = ITEMS[id];
  const src = it.model ? (cache[id] ??= await new Promise((res, rej) => loader.load(`../models/${it.model}.glb`, g => res(g.scene), undefined, rej))) : cablesModel();
  const m = src.clone(true);
  m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.material = Array.isArray(o.material) ? o.material.map(burnable) : burnable(o.material); } });
  const s0 = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
  m.scale.setScalar((it.h || 0.3) / Math.max(s0.y, 1e-3) * (it.h > 1.6 ? 0.85 : 1) * (it.model ? 1 : 1 / 0.3 * 0.12));
  const b = new THREE.Box3().setFromObject(m), c = b.getCenter(new THREE.Vector3());
  m.position.sub(new THREE.Vector3(c.x, b.min.y, c.z));
  return m;
}
function samplePoints(m) {
  const pts = [], v = new THREE.Vector3();
  m.updateMatrixWorld(true);
  m.traverse(o => { if (!o.isMesh) return; const p = o.geometry.attributes.position, step = Math.max(1, Math.floor(p.count / 1500));
    for (let i = 0; i < p.count; i += step) pts.push(v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld).clone()); });
  return pts;
}

// ---------- fire state ----------
const S = { burning: false, fans: true, R: 0, t: 0, tl: 1, dying: 0, maxR: 1, speed: 0 };
function showMsg(t) { $("msg").style.display = t ? "block" : "none"; $("msg").innerHTML = t || ""; }
function reset() {
  Object.assign(S, { burning: false, R: 0, t: 0, dying: 0 }); U.uR.value = 0; U.uLive.value = 0; U.uIgn.value.set(0, -99, 0);
  sprites.forEach(s => { s.userData.life = 0; s.material.opacity = 0; }); controls.autoRotate = true; showMsg(""); clock();
}
function ignite(point) {
  const f = facts(LIST[idx]);
  reset();
  const b = new THREE.Box3().setFromObject(current);
  U.uIgn.value.copy(point || new THREE.Vector3((b.min.x + b.max.x) / 2 - (b.max.x - b.min.x) * 0.35, b.min.y + 0.05, b.max.z));
  S.maxR = b.getSize(new THREE.Vector3()).length() * 1.05;
  S.burning = true; controls.autoRotate = false;
  S.speed = (S.fans ? f.speedOn : f.speedOff) ?? 0;
  // time-lapse chosen so the whole object burns in ~20 s on screen; the clock shows real time
  S.tl = S.speed > 0 ? Math.max(1, (S.maxR * 1000 / S.speed) / 20) : 30;
  U.uVent.value.set(1, 0, 0); U.uStretch.value = S.fans ? 0.55 : (f.c.gravity_g > 0 ? 0.2 : 0.05);
  if (f.noIgnite) { S.dying = 2.5; showMsg(`NASA's SAFFIRE tests could not ignite ${MATERIALS[f.it.mat].name.toLowerCase()} up to 22.1 % O₂: the igniter chars it, the flame doesn't take.`); }
  else if (!S.fans && !f.ins?.fans_off?.burns) { S.dying = 3; showMsg("Fans off: without airflow the flame starves of oxygen and goes out, as NASA's BASS-II saw."); }
  else if (!S.fans) showMsg(hab === "moon" ? "Fans off, but lunar gravity makes hot gas rise and pulls in fresh air: the fire keeps going (physics; no lunar fire tests exist)." : "Fans off, but this flame keeps burning.");
  else if (S.fans && !f.ins?.fans_on?.burns) S.dying = 3;
}
function setFans(on) {
  S.fans = on; $("fans").textContent = `Fans: ${on ? "on" : "off"}`;
  if (!S.burning) return;
  const f = facts(LIST[idx]);
  S.speed = (on ? f.speedOn : f.speedOff) ?? 0;
  U.uStretch.value = on ? 0.55 : (f.c.gravity_g > 0 ? 0.2 : 0.05);
  if (!on && !f.ins?.fans_off?.burns) { S.dying = 3; showMsg("Fans off: without airflow the flame starves of oxygen and goes out, as NASA's BASS-II saw."); }
  else if (!on) showMsg(hab === "moon" ? "Fans off, but lunar gravity makes hot gas rise and pulls in fresh air: the fire keeps going (physics; no lunar fire tests exist)." : "Fans off, but this flame keeps burning.");
  else { S.dying = 0; U.uLive.value = Math.max(U.uLive.value, 0.2); showMsg(""); }
}
function clock() {
  const real = S.t * S.tl, mm = Math.floor(real / 60), ss = Math.floor(real % 60);
  $("clock").innerHTML = S.burning || S.R > 0
    ? `<b>${mm}:${String(ss).padStart(2, "0")}</b> real time · ×${Math.round(S.tl)} time-lapse<br>${S.speed ? `spreading ${S.speed.toFixed(S.speed < 0.5 ? 2 : 1)} mm/s` : "not spreading"}${U.uLive.value < 0.05 && S.R > 0 ? " · out" : ""}`
    : "Ready: press Ignite or click the object";
}

// ---------- UI ----------
function renderUI() {
  const f = facts(LIST[idx]);
  $("name").textContent = f.it.name;
  $("band").textContent = f.band[0]; $("band").style.cssText = `background:color-mix(in srgb, ${f.band[1]} 20%, transparent);color:${f.band[1]}`;
  $("line").style.background = `linear-gradient(90deg,transparent,${f.band[1]},transparent)`;
  const yes = b => b ? "keeps burning" : "goes out";
  const rows = [
    ["Material", MATERIALS[f.it.mat].name], ["Air here", `${(f.c.o2 * 100).toFixed(0)} % O₂ · ${(f.c.pressure_kpa / 6.895).toFixed(1)} psi · ${f.c.gravity_g ? f.c.gravity_g + " g" : "0 g"}`],
    ["NASA verdict", f.v.note.split(":")[0].replace(/\.$/, "")],
    ...(f.ins ? [["Fans on / off", `${yes(f.ins.fans_on.burns)} / ${yes(f.ins.fans_off.burns)}`]] : []),
    ...(f.minO2 ? [["Burns down to", `~${(f.minO2 * 100).toFixed(0)} % O₂ (fans on)`]] : []),
    ...(f.speedOn ? [["Spread (fans on)", `${f.speedOn.toFixed(f.speedOn < 0.5 ? 2 : 1)} mm/s`]] : []),
    ...(f.safe ? [["Keep flammables", `≥ ${f.safe.p90} m away`]] : []),
  ];
  $("card").innerHTML = rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("") +
    `<p class="note">${f.it.text}</p><p class="note"><span class="tag">MODELS</span>Fire behaviour from the NASA-calibrated simulation; spread speed fitted to 6 of 7 NASA targets; safe distance is an engineering estimate. <a href="../checked.html" style="color:#5aa9ff">How we checked</a></p>`;
  $("strip").innerHTML = `<button class="arrow" id="prev" aria-label="Previous">‹</button>` +
    LIST.map((id, i) => `<div class="it ${i === idx ? "on" : ""}" data-i="${i}" style="--c:${facts(id).band[1]}">${ITEMS[id].name}</div>`).join("") +
    `<button class="arrow" id="next" aria-label="Next">›</button>`;
  $("prev").onclick = () => go(idx - 1); $("next").onclick = () => go(idx + 1);
  $("strip").querySelectorAll(".it").forEach(el => el.onclick = () => go(+el.dataset.i));
  document.querySelectorAll("#hab button").forEach(b => b.classList.toggle("on", b.dataset.h === hab));
}
async function go(i) {
  idx = (i + LIST.length) % LIST.length;
  history.replaceState(null, "", `?hab=${hab}&item=${LIST[idx]}`);
  renderUI(); reset();
  const m = await load(LIST[idx]);
  if (current) scene.remove(current);
  current = m; scene.add(m); points = samplePoints(m);
  const b = new THREE.Box3().setFromObject(m), sz = b.getSize(new THREE.Vector3());
  size = Math.max(sz.x, sz.y, sz.z);
  controls.target.set(0, sz.y * 0.45, 0); camera.position.set(size * 1.5 + 0.8, sz.y * 0.75 + 0.5, size * 1.8 + 1.0);
}
document.querySelectorAll("#hab button").forEach(b => b.onclick = () => { hab = b.dataset.h; go(idx); });
$("ignite").onclick = () => ignite(); $("reset").onclick = reset; $("fans").onclick = () => setFans(!S.fans);
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(idx + 1); if (e.key === "ArrowLeft") go(idx - 1); });
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {   // a click (not a drag) on the object lights it there
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5 || !current) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(current, true)[0]; if (hit) ignite(hit.point);
});

// ---------- loop ----------
let last = performance.now();
function update(dt) {
  if (S.burning) {
    S.t += dt;
    const grow = S.speed / 1000 * S.tl;  // m per screen-second
    U.uR.value = S.R = Math.min(S.maxR, S.R + grow * dt + (S.R < 0.06 ? 0.08 * dt : 0));
    if (S.dying > 0) { S.dying -= dt; U.uLive.value = Math.max(0, Math.min(1, S.dying / 2.5)); if (S.dying <= 0) { S.burning = false; U.uLive.value = 0; } }
    else U.uLive.value = Math.min(1, U.uLive.value + dt * 2);
    if (S.R >= S.maxR - 1e-3) { U.uLive.value = Math.max(0, U.uLive.value - dt * 0.6); if (U.uLive.value <= 0) S.burning = false; }
    // spawn flames on surface points right at the front
    const live = U.uLive.value;
    if (live > 0.05 && points.length) for (let k = 0; k < 40; k++) {
      const p = points[(Math.random() * points.length) | 0];
      if (Math.abs(dist(p) - S.R) > 0.05) continue;
      const s = sprites.find(x => x.userData.life <= 0); if (!s) break;
      s.position.copy(p); s.userData.life = 0.5 + Math.random() * 0.5; s.userData.max = s.userData.life;
      s.userData.v = new THREE.Vector3(0.12 * (S.fans ? 1 : 0.2), COND[hab].gravity_g > 0 ? 0.25 : 0.02, 0);
      s.scale.setScalar((0.12 + Math.random() * 0.14) * live);
    }
    clock();
  }
  for (const s of sprites) {
    if (s.userData.life <= 0) { s.material.opacity = 0; continue; }
    s.userData.life -= dt; const a = s.userData.life / s.userData.max;
    s.position.addScaledVector(s.userData.v, dt); s.material.opacity = a * 0.9;
    s.material.color.setRGB(1, 0.55 + 0.4 * a, COND[hab].gravity_g > 0 ? 0.3 * a : 0.6 * a);  // microgravity: bluer
  }
  ring.material.color.set(S.burning ? 0xff3d1f : 0xff7a2f);
}
renderer.setAnimationLoop(now => {
  update(Math.min(0.05, (now - last) / 1000)); last = now;
  controls.update(); renderer.render(scene, camera);
});
await go(idx);
// test hook for screenshots: ?burn=<seconds> lights the object and fast-forwards (&fans=off to cut the fans first)
if (q.get("burn")) { if (q.get("fans") === "off") setFans(false); ignite(); for (let i = 0; i < +q.get("burn") * 30; i++) update(1 / 30); }
</script>
