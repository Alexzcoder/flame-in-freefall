<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside the habitat · Flame in Freefall</title>
<link rel="icon" href="../img/ember-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
:root{--bg:#07090e;--panel:#12151ef2;--line:#2a303c;--fg:#e4e7ee;--mute:#8a93a6;--acc:#ff7a2f;--ok:#3ecf8e;--warn:#f6c945;--bad:#ff5c8a;--blue:#5aa9ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0}
.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:linear-gradient(#07090eee,#07090e00)}
.bar a{color:var(--fg);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:#12151e;border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{font:inherit;color:var(--mute);background:none;border:0;border-radius:7px;padding:6px 12px;cursor:pointer}.seg button.on{background:var(--acc);color:#1a0d05;font-weight:700}
.legend{position:fixed;left:14px;bottom:14px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend span{background:#12151ecc;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;color:#c9cdd6}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.legend button{font:inherit;font-size:12.5px;background:#12151ecc;color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer}
#tip{position:fixed;z-index:9;pointer-events:none;background:#161a23f2;border:1px solid #39414f;border-radius:10px;padding:9px 12px;font-size:12.5px;display:none;max-width:270px;box-shadow:0 10px 30px #000a}
#tip b{font-size:14px}#tip .c{color:var(--mute);font-size:12px;margin-top:2px}
.panel{position:fixed;right:14px;top:60px;z-index:6;width:min(370px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:none}
.panel h2{font-size:18px;margin:0 0 2px}.panel .cat{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
.panel p{color:#c9cdd6;margin:6px 0 10px}.panel .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer}
.verdict{background:#181c25;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.st{display:inline-block;font-weight:700;border-radius:20px;padding:2px 10px;font-size:13px;margin-bottom:4px}
.s-spreads{background:#ff5c8a22;color:#ff9ab6}.s-quench,.s-no_spread,.s-blowoff{background:#3ecf8e22;color:#7ee8b8}.s-untested{background:#f6c94522;color:#f6dc8a}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:4px}.t-data{background:#3ecf8e22;color:#7ee8b8}.t-assumption{background:#f6c94522;color:#f6dc8a}
.src{font-size:12px;color:#c9cdd6}
video{width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;border-radius:8px;display:block;margin-top:8px}
.vlbl{font-size:11.5px;color:var(--mute);margin-top:4px}
.go{display:inline-block;margin-top:10px;background:var(--acc);color:#1a0d05;font-weight:700;border-radius:9px;padding:8px 13px;text-decoration:none}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:62px;z-index:4;background:#12151ecc;border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:#d3d7df;font-size:13px;pointer-events:none}
@media(max-width:700px){.panel{top:auto;bottom:62px;max-height:55vh}.hint{display:none}}
</style>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <a href="/station/"><img src="../img/ember-logo.gif" width="34" height="34" alt="Flame in Freefall"> ← Station</a>
  <div class="seg" id="hab"><button data-h="iss">ISS module</button><button data-h="moon">Moon base</button></div>
</div>
<div class="hint" id="hint">Drag to look around · hover the markers · click one for details</div>
<div class="legend"><span><i style="background:#ff7a2f"></i>Burns: NASA data</span><span><i style="background:#3ecf8e"></i>Fire safety</span><span><i style="background:#5aa9ff"></i>Systems</span><button id="home">⟲ View all</button><a href="flame.html" style="text-decoration:none"><button>🔥 Flame lab</button></a></div>
<div id="tip"></div>
<aside class="panel" id="panel"></aside>
<script type="module">
import { createHabitat } from "./habitat3d.js";
import { materialVerdict, MATERIALS, SRC } from "./firemodel.js";
const $ = id => document.getElementById(id);
const COND = { iss: { o2: 0.21, pressure_kpa: 101.325, gravity_g: 0, vent_cm_s: 10 }, moon: { o2: 0.30, pressure_kpa: 70.3, gravity_g: 0.166, vent_cm_s: 5 } };
const q = new URLSearchParams(location.search), hab = q.get("hab") === "iss" ? "iss" : "moon", cond = COND[hab];
document.querySelectorAll("#hab button").forEach(b => { b.classList.toggle("on", b.dataset.h === hab); b.onclick = () => location.search = "?hab=" + b.dataset.h; });
const CATNAME = { burn: ["Burns", "#ff7a2f"], safety: ["Fire safety", "#3ecf8e"], system: ["System", "#5aa9ff"] };
const STATE = { spreads: "🔥 A flame would spread", quench: "✓ A flame would go out by itself", no_spread: "✓ Doesn't spread", blowoff: "✓ Blown out", untested: "? Never tested at this oxygen level" };
let media = null, insights;
const insightsP = fetch("insights.json").then(r => r.ok ? r.json() : null).catch(() => null);
const riskP = fetch("risk.json").then(r => r.ok ? r.json() : null).catch(() => null);

const world = createHabitat($("view"), hab, {
  onHover(it, e) {
    const t = $("tip"); if (!it) { t.style.display = "none"; return; }
    $("hint").style.display = "none";
    t.innerHTML = `<b>${it.name}</b><div class="c" style="color:${CATNAME[it.cat][1]}">${CATNAME[it.cat][0]}${it.mat ? " · " + MATERIALS[it.mat].name : ""}</div><div class="c">Click for details</div>`;
    t.style.display = "block";
    t.style.left = Math.min(e.clientX + 16, innerWidth - t.offsetWidth - 8) + "px"; t.style.top = Math.min(e.clientY + 16, innerHeight - t.offsetHeight - 8) + "px";
  },
  onSelect: show,
});
$("home").onclick = () => { world?.reset(); $("panel").style.display = "none"; };

async function show(it) {
  const p = $("panel"); p.style.display = "block";
  let html = `<button class="x" aria-label="Close">×</button><div class="cat" style="color:${CATNAME[it.cat][1]}">${CATNAME[it.cat][0]}</div><h2>${it.name}</h2><p>${it.text}</p>`;
  if (it.mat) {
    const v = materialVerdict(it.mat, cond), m = MATERIALS[it.mat], s = SRC[(v.src || [])[0]];
    html += `<div class="verdict"><div class="src" style="margin-bottom:6px">${m.name}${m.proxy ? ` (NASA tested ${m.proxy})` : ""} at this habitat's air: ${(cond.o2 * 100).toFixed(0)} % O₂, ${(cond.pressure_kpa / 6.895).toFixed(1)} psi, ${cond.gravity_g ? cond.gravity_g + " g" : "microgravity"}</div>
      <span class="st s-${v.state}">${STATE[v.state] || v.state}</span>${v.extrapolated ? ' <span class="tag t-assumption">EXTRAPOLATED</span>' : ""}
      <div class="src" style="margin-top:6px">${v.note}</div>
      ${s ? `<div class="src" style="margin-top:6px"><span class="tag t-${s.kind}">${s.kind === "data" ? "DATA" : "ASSUMPTION"}</span>${s.text}</div>` : ""}</div>
      <div id="sim"></div>
      <div id="real"></div>
      <a class="go" href="flame.html?fuel=${it.mat.startsWith("pmma") ? "pmma" : "fabric"}&g=${cond.gravity_g}&o2=${cond.o2}&flow=${cond.vent_cm_s}">See how this flame behaves in the Flame lab →</a>`;
  }
  p.innerHTML = html; p.querySelector(".x").onclick = () => p.style.display = "none";
  insights ??= await insightsP;
  const risk = (await riskP)?.habitats?.[hab]?.fans?.on?.objects?.[it.id];
  const ins = insights?.habitats?.[hab]?.items?.[it.id];
  if (ins && $("sim")) {   // flame/insights.py: calibrated simulation of a small fire of this material, fans on vs off
    const st = x => x.burns ? '<span class="st s-spreads">keeps burning</span>' : '<span class="st s-quench">goes out</span>';
    $("sim").innerHTML = `<div class="verdict"><div class="src" style="margin-bottom:6px"><b style="color:var(--fg)">Simulated small fire</b> ·
      ${insights.model.calibrated ? "physics fitted to NASA runs" : "physics not yet fitted to NASA runs"}</div>
      <div class="src">Fans on: ${st(ins.fans_on)} &nbsp; Fans off: ${st(ins.fans_off)}</div>
      ${ins.notes.map(n => `<div class="src" style="margin-top:6px">${n}</div>`).join("")}
      ${ins.caveat ? `<div class="src" style="margin-top:6px"><span class="tag t-assumption">NOTE</span>${ins.caveat}</div>` : ""}
      ${risk?.safe_distance_m ? `<div class="src" style="margin-top:8px"><b style="color:var(--fg)">Keep other flammables at least ${risk.safe_distance_m.p90} m away</b>
        (typical ${risk.safe_distance_m.median} m${risk.nearest_flammable_m ? `; nearest one here is ${risk.nearest_flammable_m} m` : ""}).
        ${risk.spread_mm_s ? `Spreads about ${risk.spread_mm_s.toFixed(1)} mm/s over the material with the fans on.` : ""}
        <span class="tag t-assumption">ESTIMATE</span>radiated heat vs. ignition thresholds, typical lab values</div>` : ""}</div>`;
  }
  if (it.mat) {   // nearest real NASA burn of a solid material at these conditions that has footage
    media ??= await fetch("/media/index.json").then(r => r.ok ? r.json() : { runs: {} }).catch(() => ({ runs: {} }));
    const near = await fetch(`/api/nearest?o2=${cond.o2}&pressure=${cond.pressure_kpa}&flow=${cond.vent_cm_s}&gravity=${cond.gravity_g}&phase=solid&k=50`).then(r => r.json()).catch(() => null);
    const want = it.mat.startsWith("pmma") ? ["pmma"] : it.mat === "fabric" ? ["sibal"] : [it.mat];   // same material first
    const withClip = (near?.matches || []).filter(x => media.runs[x.run_id]);
    const m = withClip.find(x => want.includes(x.fuel)) || withClip[0];
    if (m && $("real")) { const c = media.runs[m.run_id];
      $("real").innerHTML = `<video src="/${c.clip}" poster="/${c.thumbnail}" muted autoplay loop playsinline></video>
        <div class="vlbl"><b style="color:#c9cdd6">Real NASA footage, brightened for visibility</b> · run ${m.run_id} (${m.acronym}), ${m.fuel} at ${m.o2_pct} % O₂${m.match === "near" ? "" : ` · <span style="color:var(--warn)">closest available: ${m.differences[0] || "different conditions"}</span>`}</div>`; }
  }
}
// test hook: ?select=<item id> opens that item's details (screenshots)
const sel = q.get("select"); if (sel && world) setTimeout(() => { world.focus(sel); show({ id: sel, ...world.items[sel] }); }, 2500);
</script>
</body>
</html>
